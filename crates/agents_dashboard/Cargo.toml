[package]
name = "agents_dashboard"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/agents_dashboard.rs"
doctest = false

[features]
default = []
test-support = ["acp_thread/test-support", "gpui/test-support", "project/test-support", "workspace/test-support"]

[dependencies]
acp_thread.workspace = true
agent-client-protocol.workspace = true
agent_ui.workspace = true
collections.workspace = true
editor.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
regex.workspace = true
serde_json.workspace = true
theme.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[dev-dependencies]
acp_thread = { workspace = true, features = ["test-support"] }
feature_flags.workspace = true
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
